<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#F8FAFC"/>

  <!-- Login Screen -->
  <rect x="50" y="50" width="320" height="500" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>

  <!-- Logo/Header -->
  <rect x="150" y="80" width="120" height="120" fill="#EEF2FF" rx="60"/>
  <text x="210" y="155" fill="#6366F1" font-size="48" text-anchor="middle" font-weight="700">J</text>

  <text x="210" y="230" fill="#1E293B" font-size="20" font-weight="700" text-anchor="middle">Connexion</text>
  <text x="210" y="250" fill="#64748B" font-size="13" text-anchor="middle">Accédez à votre assistant juridique</text>

  <!-- Email Input -->
  <text x="75" y="290" fill="#1E293B" font-size="13" font-weight="500">Email</text>
  <rect x="75" y="300" width="270" height="44" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
  <text x="90" y="327" fill="#94A3B8" font-size="14">votre@email.fr</text>

  <!-- Password Input -->
  <text x="75" y="370" fill="#1E293B" font-size="13" font-weight="500">Mot de passe</text>
  <rect x="75" y="380" width="270" height="44" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
  <text x="90" y="407" fill="#94A3B8" font-size="14">••••••••</text>

  <!-- Remember Me -->
  <rect x="75" y="440" width="18" height="18" fill="#FFFFFF" stroke="#CBD5E1" rx="3"/>
  <text x="100" y="453" fill="#64748B" font-size="13">Se souvenir de moi</text>

  <text x="345" y="453" fill="#6366F1" font-size="13" text-anchor="end">Mot de passe oublié?</text>

  <!-- Sign In Button -->
  <rect x="75" y="480" width="270" height="44" fill="#6366F1" rx="6"/>
  <text x="210" y="507" fill="#FFFFFF" font-size="15" text-anchor="middle" font-weight="600">Se connecter</text>

  <!-- Signup Screen -->
  <rect x="440" y="50" width="320" height="500" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>

  <text x="600" y="100" fill="#1E293B" font-size="20" font-weight="700" text-anchor="middle">Créer un compte</text>
  <text x="600" y="120" fill="#64748B" font-size="13" text-anchor="middle">Nouvel utilisateur interne</text>

  <!-- Name Input -->
  <text x="465" y="160" fill="#1E293B" font-size="13" font-weight="500">Nom complet</text>
  <rect x="465" y="170" width="270" height="44" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
  <text x="480" y="197" fill="#94A3B8" font-size="14">Jean Dupont</text>

  <!-- Email Input -->
  <text x="465" y="240" fill="#1E293B" font-size="13" font-weight="500">Email professionnel</text>
  <rect x="465" y="250" width="270" height="44" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
  <text x="480" y="277" fill="#94A3B8" font-size="14">jean@entreprise.fr</text>

  <!-- Password Input -->
  <text x="465" y="320" fill="#1E293B" font-size="13" font-weight="500">Mot de passe</text>
  <rect x="465" y="330" width="270" height="44" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
  <text x="480" y="357" fill="#94A3B8" font-size="14">••••••••</text>

  <!-- Confirm Password -->
  <text x="465" y="400" fill="#1E293B" font-size="13" font-weight="500">Confirmer mot de passe</text>
  <rect x="465" y="410" width="270" height="44" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
  <text x="480" y="437" fill="#94A3B8" font-size="14">••••••••</text>

  <!-- Create Account Button -->
  <rect x="465" y="480" width="270" height="44" fill="#6366F1" rx="6"/>
  <text x="600" y="507" fill="#FFFFFF" font-size="15" text-anchor="middle" font-weight="600">Créer mon compte</text>

  <!-- Reset Password Screen -->
  <rect x="830" y="50" width="320" height="500" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>

  <rect x="930" y="80" width="120" height="120" fill="#EEF2FF" rx="60"/>
  <text x="990" y="155" fill="#6366F1" font-size="48" text-anchor="middle">🔑</text>

  <text x="990" y="230" fill="#1E293B" font-size="20" font-weight="700" text-anchor="middle">Réinitialisation</text>
  <text x="990" y="260" fill="#64748B" font-size="13" text-anchor="middle">Entrez votre email pour recevoir</text>
  <text x="990" y="278" fill="#64748B" font-size="13" text-anchor="middle">un lien de réinitialisation</text>

  <!-- Email Input -->
  <text x="855" y="320" fill="#1E293B" font-size="13" font-weight="500">Email</text>
  <rect x="855" y="330" width="270" height="44" fill="#F8FAFC" stroke="#CBD5E1" rx="6"/>
  <text x="870" y="357" fill="#94A3B8" font-size="14">votre@email.fr</text>

  <!-- Send Reset Link Button -->
  <rect x="855" y="400" width="270" height="44" fill="#6366F1" rx="6"/>
  <text x="990" y="427" fill="#FFFFFF" font-size="15" text-anchor="middle" font-weight="600">Envoyer le lien</text>

  <!-- Back to Login -->
  <text x="990" y="480" fill="#6366F1" font-size="13" text-anchor="middle">← Retour à la connexion</text>
</svg>
